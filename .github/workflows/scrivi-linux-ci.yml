name: Scrivi Linux App CI

# Builds the Linux Qt/QML app (EP-020). Separate from ScriviCore CI so the core
# build stays Qt-free; this job installs Qt6 and links the ScriviCore target.
on:
  push:
    branches: [main]
    paths:
      - 'platforms/linux/**'
      - 'ScriviCore/**'
      - 'CMakeLists.txt'
      # ⚠️ T-0541: the guard itself, so editing it re-runs it HERE too and the
      # two workflows cannot disagree about what the rule is.
      - 'scripts/check-package-boundary.sh'
      - '.github/workflows/scrivi-linux-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'platforms/linux/**'
      - 'ScriviCore/**'
      - 'CMakeLists.txt'
      # ⚠️ T-0541: the guard itself, so editing it re-runs it HERE too and the
      # two workflows cannot disagree about what the rule is.
      - 'scripts/check-package-boundary.sh'
      - '.github/workflows/scrivi-linux-ci.yml'

jobs:
  build-linux-app:
    name: ubuntu-24.04 (Qt 6.4)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # ⚠️ EP-041 SP-149 / T-0541 — the [I-0197] boundary guard, LINUX HALF.
      #
      # ⚠️ ONE script, TWO pattern sets, BOTH workflows (user ruling Q3,
      # 2026-09-21): a single place to state the rule, so the two platforms cannot
      # drift in what they consider a violation — which is the very failure
      # [I-0197] and [I-0215] are about.
      #
      # ⚠️ IT RUNS FIRST, BEFORE THE ~3-MINUTE Qt INSTALL. A boundary violation is
      # knowable from the source alone; making a contributor wait for a full Qt
      # toolchain to be told about a grep hit would be backwards.
      #
      # ⚠️ [I-0241] is why the Linux half is not optional: EditorShell listed and
      # parsed EVERY file in `objects/historical-events/` to recover ONE field the
      # core's projection dropped — a bypass Apple had already retired, re-earned
      # on Linux, and found by NOTHING for months.
      - name: ScriviCore boundary guard
        run: scripts/check-package-boundary.sh

      # Qt 6.4 + QML modules from apt — matches the Docker/alpha toolchain pin.
      - name: Install Qt6 + build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libssl-dev \
            qt6-base-dev qt6-declarative-dev \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-templates \
            qml6-module-qtquick-layouts qml6-module-qtquick-window \
            qml6-module-qtqml-workerscript qml6-module-qtqml-models \
            libgl1-mesa-dev

      # ⚠️ Debug, as every build is until Scrivi reaches its release state (user, 2026-10-17). Debug is -O0: about 4x
      # slower than Release on CPU-bound work (measured 2026-10-12), so no smoke asserts a tight time.
      - name: Configure
        run: cmake -S . -B build -G Ninja -DSCRIVI_BUILD_LINUX=ON -DSCRIVI_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      # Headless smoke: launch the app under Xvfb and confirm it starts a window
      # and stays up briefly (proves the QML engine + ScriviBridge load without
      # crashing). A non-zero exit or immediate quit fails the job.
      - name: Headless smoke test
        run: |
          sudo apt-get install -y --no-install-recommends xvfb
          xvfb-run -a --server-args="-screen 0 1024x768x24" \
            timeout --preserve-status 8 ./build/platforms/linux/scrivi_linux &
          APP=$!
          sleep 5
          if ! kill -0 "$APP" 2>/dev/null; then
            echo "App exited early — smoke test failed."
            wait "$APP"; exit 1
          fi
          echo "App is running under Xvfb — smoke test passed."
          kill "$APP" 2>/dev/null || true

      # Persistence smoke (SP-059 / T-0228): run the console harness twice against
      # one temp $XDG_DATA_HOME and assert identity (AC4) + recents (AC5) survive a
      # simulated restart. No display needed (Qt6::Core only).
      - name: Persistence smoke test
        run: |
          platforms/linux/tests/persistence_smoke.sh \
            ./build/platforms/linux/scrivi_linux_persistence_smoke

      # Full-loop lifecycle smoke (SP-060 / T-0233): create → open (ready) →
      # close → reopen-from-recent, and assert it survives a restart (AC3/AC7).
      - name: Lifecycle full-loop smoke test
        run: |
          platforms/linux/tests/lifecycle_smoke.sh \
            ./build/platforms/linux/scrivi_linux_lifecycle_smoke

      # Scene-load smoke (SP-061 / T-0237, EP-022 AC1/AC2): build a 3-scene
      # fixture and assert the editor's continuous-viewport assembly loads every
      # body at its recorded offset (open_project + open_scene loop +
      # SceneDocument). Uses the Qt offscreen platform (set inside the script).
      - name: Scene-load smoke test
        run: |
          platforms/linux/tests/scene_load_smoke.sh \
            ./build/platforms/linux/scrivi_linux_scene_load_smoke

      # Editable-map smoke (SP-062 / T-0238): pure SceneDocument logic — assert the
      # boundary classification (editable body vs. protected heading/separator) and
      # the offset-map maintenance on insert + delete that keep edits inside their
      # owning scene. Offscreen platform (set inside the script).
      - name: Editable-map smoke test
        run: |
          platforms/linux/tests/editor_map_smoke.sh \
            ./build/platforms/linux/scrivi_linux_editor_map_smoke

      # Per-scene save smoke (SP-062 / T-0239, EP-022 AC3): create → open →
      # saveScene(new body) → reopen asserts the new bytes are on disk, proving the
      # editor's auto-save path (ScriviBridge::saveScene → scrivi_save_scene) writes
      # the real .md. No display needed.
      - name: Scene-save smoke test
        run: |
          platforms/linux/tests/scene_save_smoke.sh \
            ./build/platforms/linux/scrivi_linux_scene_save_smoke

      # In-editor create smoke (SP-062 / T-0240 + T-0241, EP-022 AC3): createScene
      # after the active scene (persists in order) and createChapter at the end
      # (persists last, in a new chapter), each spliced into the offset map via
      # insertSceneAfter. Offscreen platform (set inside the script).
      - name: Scene-create smoke test
        run: |
          platforms/linux/tests/scene_create_smoke.sh \
            ./build/platforms/linux/scrivi_linux_scene_create_smoke

      # In-navigator delete smoke (SP-065 / T-0253, EP-023 AC1/AC2): build a
      # 4-scene/2-chapter fixture, splice scenes/chapters out of a SceneDocument via
      # removeScene / removeChapter (asserting the offset map stays well-formed), then
      # delete via bridge.deleteScene / deleteChapter and assert the removals persist
      # on reopen. Offscreen platform (set inside the script).
      - name: Scene-delete smoke test
        run: |
          platforms/linux/tests/scene_delete_smoke.sh \
            ./build/platforms/linux/scrivi_linux_scene_delete_smoke

      # In-navigator rename smoke (SP-066 / T-0257, EP-023 AC3): build a 2-chapter
      # fixture, rename a scene + a chapter via bridge.renameScene / renameChapter
      # (asserting the sidecar title round-trips on reopen, incl. blank→cleared), and
      # apply the label/heading update to a SceneDocument (setChapterTitle rewrites the
      # live heading in place, offset map well-formed). Offscreen platform.
      - name: Scene-rename smoke test
        run: |
          platforms/linux/tests/scene_rename_smoke.sh \
            ./build/platforms/linux/scrivi_linux_scene_rename_smoke

      # Scene/chapter reorder smoke (SP-067 / T-0263, EP-023 AC4 + I-0063/I-0064):
      # build a 5-scene/2-chapter fixture, splice scenes within + across chapters via
      # SceneDocument::moveScene (offset map well-formed, chapter-first re-promotion),
      # persist a cross-chapter reorder via ScriviBridge::reorderScene (assert order on
      # reopen), replay the I-0064 chapter-split orchestration (end-of-scene + mid-scene)
      # and renumber created "Chapter N" chapters (I-0063). Offscreen platform.
      - name: Scene-reorder smoke test
        run: |
          platforms/linux/tests/scene_reorder_smoke.sh \
            ./build/platforms/linux/scrivi_linux_scene_reorder_smoke

      # Chapter-reorder smoke (SP-073 / T-0296, EP-023 AC5): build a 4-scene/3-chapter
      # fixture, move whole chapters as blocks via SceneDocument::moveChapter (map
      # well-formed, bodies + member order preserved, no-op landings refused), persist
      # moves via ScriviBridge::reorderChapter (assert order + bodies on reopen), and
      # prove the stale-path refresh: the reorder reslugs the chapter folder, the
      # envelope reports the new metadataPath, and a save through the refreshed paths
      # lands (I-0074/I-0079 class). Offscreen platform.
      - name: Chapter-reorder smoke test
        run: |
          platforms/linux/tests/chapter_reorder_smoke.sh \
            ./build/platforms/linux/scrivi_linux_chapter_reorder_smoke

      # Scene/chapter merge smoke (SP-076 / T-0306, EP-028 AC5/AC6/AC7): build a
      # 5-scene/2-chapter fixture, merge a scene into the previous same-chapter scene via
      # ScriviBridge::mergeScene (assert on reopen the absorbed scene's files are gone and
      # the survivor holds both bodies, blank-line joined), then merge a whole chapter into
      # the previous one via ScriviBridge::mergeChapter (assert every scene relocated —
      # nothing lost, the I-0083 fix — the emptied chapter removed, bodies intact).
      # Offscreen platform.
      - name: Scene-merge smoke test
        run: |
          platforms/linux/tests/scene_merge_smoke.sh \
            ./build/platforms/linux/scrivi_linux_scene_merge_smoke

      # Timeline story-time smoke (SP-080 / T-0328, EP-025 AC3): build a 3-scene fixture,
      # place a scene manually 2h after the previous scene's end (setSceneStoryTime
      # source="manual") + re-persist the chain (assert on reopen the manual gap persisted
      # and later default scenes stayed on the chain), then reset to default (assert it
      # returns to the chain). The drag/picker UI is verified live over VNC. Offscreen.
      - name: Timeline story-time smoke test
        run: |
          platforms/linux/tests/timeline_story_time_smoke.sh \
            ./build/platforms/linux/scrivi_linux_timeline_story_time_smoke

      # Story-structure smoke (SP-081 / T-0332, EP-025 AC4): set a built-in structure +
      # assert it persisted; assign a scene to a band + assert the bandID persisted;
      # re-proportion the bands (update_band_layout) + assert it persisted; remove the
      # structure + assert the scene's band assignment is PRESERVED (AC4). Offscreen.
      - name: Story-structure smoke test
        run: |
          platforms/linux/tests/story_structure_smoke.sh \
            ./build/platforms/linux/scrivi_linux_story_structure_smoke

      # Timeline-events smoke (SP-082 / T-0344, EP-025 AC5): create/update/delete a
      # historical event (list round-trip); import a fixture .scrivi-timeline.json
      # (stored + metadata + on-disk file); hide/show + update-offset persist; export a
      # valid scrivi.externalTimeline.v1 body carrying the surviving historical event;
      # remove clears the list. The dot rendering + drag + dialogs are live-VNC. Offscreen.
      - name: Timeline-events smoke test
        run: |
          platforms/linux/tests/timeline_events_smoke.sh \
            ./build/platforms/linux/scrivi_linux_timeline_events_smoke

      # Timeline-clustering smoke (SP-084 / T-0349, EP-025 AC6b): drives TimelinePanel's
      # clustering pass — co-located dots collapse into one aggregate of N; zooming in
      # resolves them into singletons; well-separated dots never cluster; a historical
      # event co-located with scenes joins the aggregate. Offscreen QApplication.
      - name: Timeline-clustering smoke test
        run: |
          platforms/linux/tests/timeline_cluster_smoke.sh \
            ./build/platforms/linux/scrivi_linux_timeline_cluster_smoke

      # Quit-path smoke (SP-062 regression guard): the shell flip broke the landing
      # Quit button (a QQuickWidget engine doesn't auto-wire QQmlEngine::quit()).
      # Assert the connection main.cpp adds drives the app to exit. Offscreen.
      - name: Quit-path smoke test
        run: |
          platforms/linux/tests/quit_smoke.sh \
            ./build/platforms/linux/scrivi_linux_quit_smoke

      # Format commands + balanced edits (SP-175 / T-0602, EP-048 S3b): the Format menu's real shortcuts,
      # the pending pair (never scene text, never dirty), balanced cut/copy/paste, across scenes. Offscreen.
      - name: Format commands smoke test
        run: |
          platforms/linux/tests/format_smoke.sh \
            ./build/platforms/linux/scrivi_linux_format_smoke

      # Find over the presented text (SP-176 / T-0603, EP-048 S4): escapes, markers and heading prefixes hidden; never across
      # a scene or into a chapter title; the options; Edit ▸ Find's real shortcuts; the presented text measured on ~1.85 MB.
      - name: Find smoke test
        run: |
          platforms/linux/tests/find_smoke.sh \
            ./build/platforms/linux/scrivi_linux_find_smoke

      # Undo / redo (SP-178 / T-0605, EP-026 S2): a real EditorShell and real keys — one step per sentence, Ctrl+Z /
      # Ctrl+Shift+Z (not Ctrl+Y), paste and cross-scene delete as one step, persistence + the session warning, barriers.
      - name: Undo / redo smoke test
        run: |
          platforms/linux/tests/undo_smoke.sh \
            ./build/platforms/linux/scrivi_linux_undo_smoke

      # Copy buffers 1–9 (SP-179 / T-0606, EP-026 S5): two real project windows through AppEnvironment and real keys —
      # Ctrl+N copy, Ctrl+Shift+N paste, Alt+N cut, View ▸ Show Buffers and the palette following the front project.
      - name: Copy buffers smoke test
        run: |
          platforms/linux/tests/buffers_smoke.sh \
            ./build/platforms/linux/scrivi_linux_buffers_smoke

      # Structured cut / copy / paste (SP-180 / T-0607, EP-026 S4): Ctrl+C / Ctrl+V across scene and chapter breaks as ONE
      # undo step, the buffers holding the structure, and a history made on the Mac replayed on Linux.
      - name: Structured paste smoke test
        run: |
          platforms/linux/tests/structured_paste_smoke.sh \
            ./build/platforms/linux/scrivi_linux_structured_paste_smoke

      # Replace / Replace All (SP-181 / T-0608, EP-048 S4b): Replace over the current match; Replace All off the GUI thread,
      # ONE undo step, only the scenes holding a match written.
      - name: Replace smoke test
        run: |
          platforms/linux/tests/replace_smoke.sh \
            ./build/platforms/linux/scrivi_linux_replace_smoke

      # Background writes (SP-181, I-0304 / I-0305): a failed save stays dirty; closing a window or quitting while a
      # project's background writes run waits for them. ⚠️ Non-root (the runner user): a read-only directory fails a save.
      - name: Background wait smoke test
        run: |
          platforms/linux/tests/background_wait_smoke.sh \
            ./build/platforms/linux/scrivi_linux_background_wait_smoke

      # Diagnostic log (SP-185 / T-0612): the watchdog's stall report, the privacy rule, two sessions, a real crash's report.
      - name: Diagnostic log smoke test
        run: |
          platforms/linux/tests/diagnostic_log_smoke.sh \
            ./build/platforms/linux/scrivi_linux_diagnostic_log_smoke

      # Project settings (SP-182 / T-0609, EP-048 S5a): the dialog over the shared project-settings.json, the bundled faces,
      # View ▸ Show Markup Hints (Ctrl+Shift+H).
      - name: Settings smoke test
        run: |
          platforms/linux/tests/settings_smoke.sh \
            ./build/platforms/linux/scrivi_linux_settings_smoke

      # ✅ 2026-10-10 (user: "add the missing smokes to CI too") — these eleven smokes existed but CI never ran them.

      # ABI parity (EP-034 / SP-121, T-0464).
      - name: ABI parity smoke test
        run: |
          platforms/linux/tests/bridge_parity_smoke.sh \
            ./build/platforms/linux/scrivi_linux_bridge_parity_smoke

      # Linux writes Apple's manuscript format: the shared corpus (EP-049 / SP-160, T-0586).
      - name: Manuscript storage format smoke test
        run: |
          platforms/linux/tests/escape_smoke.sh \
            ./build/platforms/linux/scrivi_linux_escape_smoke

      # The manuscript presenter: hidden markup, reveal, caret stops, atomic markers (EP-048 / SP-166, T-0595).
      - name: Manuscript presenter smoke test
        run: |
          platforms/linux/tests/presenter_smoke.sh \
            ./build/platforms/linux/scrivi_linux_presenter_smoke

      # The Scene Inspector (EP-035 / SP-125, T-0480–T-0483).
      - name: Scene Inspector smoke test
        run: |
          platforms/linux/tests/scene_inspector_smoke.sh \
            ./build/platforms/linux/scrivi_linux_scene_inspector_smoke

      # inspector-layout.json read + write, round-tripping what Linux does not model (EP-035 / SP-126, T-0486).
      - name: Inspector layout smoke test
        run: |
          platforms/linux/tests/inspector_layout_smoke.sh \
            ./build/platforms/linux/scrivi_linux_inspector_layout_smoke

      # The package-aware folder chooser (EP-035 / SP-127, I-0185).
      - name: Package folder chooser smoke test
        run: |
          platforms/linux/tests/package_folder_smoke.sh \
            ./build/platforms/linux/scrivi_linux_package_folder_smoke

      # Secondary text colours derived from the live palette (EP-035 / SP-127, I-0186).
      - name: Theme contrast smoke test
        run: |
          platforms/linux/tests/theme_contrast_smoke.sh \
            ./build/platforms/linux/scrivi_linux_theme_contrast_smoke

      # World paths (EP-035 / SP-127, I-0184).
      - name: Worlds path smoke test
        run: |
          platforms/linux/tests/worlds_path_smoke.sh \
            ./build/platforms/linux/scrivi_linux_worlds_path_smoke

      # Project-open progress (SP-128 / T-0500, I-0195).
      - name: Open progress smoke test
        run: |
          platforms/linux/tests/open_progress_smoke.sh \
            ./build/platforms/linux/scrivi_linux_open_progress_smoke

      # Session persistence (EP-043 / SP-147, T-0565).
      - name: Session store smoke test
        run: |
          platforms/linux/tests/session_store_smoke.sh \
            ./build/platforms/linux/scrivi_linux_session_store_smoke

      # The session-restore guard (EP-043 / SP-147, T-0566).
      - name: Restore guard smoke test
        run: |
          platforms/linux/tests/restore_guard_smoke.sh \
            ./build/platforms/linux/scrivi_linux_restore_guard_smoke
